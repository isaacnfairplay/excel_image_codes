[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-image-codes"
version = "0.1.0"
description = "Generate QR codes and barcodes suitable for Excel's IMAGE() function"
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "Excel Image Codes Developers"}
]
requires-python = ">=3.10"
dependencies = [
  "qrcode>=7.4",
  "Pillow>=9.0",
  "python-barcode>=0.15"
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
excel-image-codes = "excel_image_codes.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
